apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vllm
  namespace: llm-router
spec:
  serviceName: vllm
  replicas: 4
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      # Label set by the NVIDIA GPU Operator / GPU feature discovery.
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.30.0
          args:
            - --model=Qwen/Qwen3-8B
            - --port=8000
            - --enable-prefix-caching
            - --gpu-memory-utilization=0.90
            - --max-model-len=8192
          env:
            - name: HF_HOME
              value: /models
          ports:
            - name: http
              containerPort: 8000
          # Loading 8B weights takes minutes, longer on a cold download:
          # allow up to 15 minutes before liveness checks begin.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
          resources:
            # One GPU per replica; Qwen3-8B in bf16 is ~16 GB of weights,
            # leaving the rest of a 24 GB GPU for KV cache.
            requests: {cpu: "6", memory: 24Gi, nvidia.com/gpu: "1"}
            limits: {memory: 28Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: models, mountPath: /models}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        # vLLM uses shared memory between its processes; the container
        # default (64 MB) is too small.
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 2Gi}
  # Keep downloaded weights (~16 GB) across pod restarts.
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 50Gi
