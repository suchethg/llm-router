apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vllm
  namespace: llm-router
spec:
  serviceName: vllm
  replicas: 4
  # Pods are independent; start them together instead of one by one.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: mock
          image: llm-router/mockvllm:dev
          imagePullPolicy: IfNotPresent # loaded into kind, not pulled
          args: [-addr=:8000, -name=$(POD_NAME)]
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
