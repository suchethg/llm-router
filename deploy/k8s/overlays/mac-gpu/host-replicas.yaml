# A stable in-cluster name for each replica running on the Mac. Docker
# Desktop resolves host.docker.internal to the host from inside containers,
# including the kind node and its pods.
apiVersion: v1
kind: Service
metadata:
  name: vllm-0
  namespace: llm-router
spec:
  type: ExternalName
  externalName: host.docker.internal
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-1
  namespace: llm-router
spec:
  type: ExternalName
  externalName: host.docker.internal
