# The router and replicas run on the host; host.docker.internal reaches it
# from inside Docker Desktop. Short interval because benchmark runs are minutes long.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: router
    static_configs:
      - targets: ["host.docker.internal:8090"]
  - job_name: replicas
    static_configs:
      - targets:
          - host.docker.internal:8001
          - host.docker.internal:8002
          - host.docker.internal:8003
          - host.docker.internal:8004
