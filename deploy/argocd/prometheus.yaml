# Prometheus server only: no Alertmanager, node exporter, kube-state-metrics
# or Pushgateway, to stay light next to the vLLM replicas.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.36.1 # Prometheus v3.15.0
    helm:
      valuesObject:
        alertmanager: {enabled: false}
        kube-state-metrics: {enabled: false}
        prometheus-node-exporter: {enabled: false}
        prometheus-pushgateway: {enabled: false}
        server:
          global: {scrape_interval: 5s}
          persistentVolume: {enabled: false} # metrics are for live runs, not history
          resources: {requests: {cpu: 50m, memory: 256Mi}}
        # The router pod is found by its prometheus.io/scrape annotation (the
        # chart's kubernetes-pods job). The vLLM replicas run on the host.
        extraScrapeConfigs: |
          - job_name: replicas
            static_configs:
              - targets: ["host.docker.internal:8001", "host.docker.internal:8002"]
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
